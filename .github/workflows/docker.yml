name: docker
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t essay-builder .
      - name: Start the Studio and check it answers
        run: |
          docker run -d --name studio -p 8787:8787 essay-builder
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/ping && exit 0; sleep 1; done
          docker logs studio
          exit 1
